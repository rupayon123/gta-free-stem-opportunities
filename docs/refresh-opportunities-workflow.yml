name: Refresh public opportunities

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh source-backed static database
    runs-on: ubuntu-latest
    concurrency:
      group: gta-free-stem-opportunities-refresh
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Refresh source-backed website database
        run: npm run engine:refresh
        env:
          GTA_MAX_LIBRARY_OPPORTUNITIES: "420"
          GTA_LOOKAHEAD_DAYS: "365"
          GTA_DISCOVERY_MAX_CANDIDATES_PER_SOURCE: "250"
          GTA_MIN_LIBRARY_PAGE_SUCCESS_RATIO: "0.75"
          GTA_MIN_LIBRARY_SOURCE_SUCCESS_RATIO: "0.50"
          GTA_MIN_LIBRARY_OUTPUT_RATIO: "0.65"
          GTA_MIN_LIBRARY_OPPORTUNITIES: "30"
          GTA_MIN_DISCOVERY_SOURCE_SUCCESS_RATIO: "0.75"

      - name: Build static export
        run: npm run build

      - name: Commit refreshed database
        run: |
          if git diff --quiet -- lib/generatedLibraryOpportunities.ts lib/generatedDiscoveryReview.ts public/opportunities.json; then
            echo "No opportunity database changes found."
            exit 0
          fi
          git config user.name "gta-free-stem-bot"
          git config user.email "gta-free-stem-bot@users.noreply.github.com"
          git add lib/generatedLibraryOpportunities.ts lib/generatedDiscoveryReview.ts public/opportunities.json
          git commit -m "Refresh generated public opportunities"
          git push
