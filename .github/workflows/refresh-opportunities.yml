# REVIEW DRAFT: install only on a new operations branch, not main or the app PR.
# Reuses the existing default-registered workflow path for manual --ref dispatch.
name: Review isolated fresh-data reconciliation
on:
  workflow_dispatch:
    inputs:
      expected_ops_commit:
        description: Exact reviewed immutable operations commit
        type: string
        required: true
      expected_helpers_sha256:
        description: Independently reviewed helpers-manifest.json SHA256
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: gta-reviewed-data-reconciliation-single-writer
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'rupayon123/gta-free-stem-opportunities' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub permissions are job-level. The write credential is never passed to
    # app verification and is consumed only by the final fixed-endpoint helper.
    permissions:
      contents: write
    env:
      OPS_ROOT: ${{ github.workspace }}/ops
      APP_REPO: ${{ github.workspace }}/app-source
      EXPECTED_OPS_COMMIT: ${{ inputs.expected_ops_commit }}
      EXPECTED_HELPERS_SHA256: ${{ inputs.expected_helpers_sha256 }}
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - name: Check event and immutable operations pin
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = rupayon123/gta-free-stem-opportunities
          test "$GITHUB_SHA" = "$EXPECTED_OPS_COMMIT"
          [[ "$EXPECTED_OPS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HELPERS_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out immutable operations helpers separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified official v6 ref
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false
          fetch-depth: 1

      - name: Verify independently pinned helper sources
        run: python3 "$OPS_ROOT/hosting/reconcile/verify-helpers.py" --expected-sha256 "$EXPECTED_HELPERS_SHA256"

      - name: Check out immutable app without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9f83e87e4447b805373ff9f7f206adb737e5c413
          path: app-source
          persist-credentials: false
          fetch-depth: 0

      - name: Set up existing Node major with no persistent dependency cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # verified official v6 ref
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Guard isolated ordinary merge, offline proofs and existing QA
        run: |
          python3 "$OPS_ROOT/hosting/reconcile/guard-linux.py" \
            --new-guard-receipt "$RUNNER_TEMP/reconciliation-resource.json" \
            --timeout-seconds 1200 -- \
            python3 "$OPS_ROOT/hosting/reconcile/run-reconciliation.py"

      - name: Create only a new reviewed candidate ref after all proofs
        env:
          RECONCILE_WRITE_TOKEN: ${{ github.token }}
        run: |
          python3 "$OPS_ROOT/hosting/reconcile/guard-linux.py" \
            --new-guard-receipt "$RUNNER_TEMP/candidate-ref-resource.json" \
            --timeout-seconds 300 -- \
            python3 "$OPS_ROOT/hosting/reconcile/publish-candidate.py"
