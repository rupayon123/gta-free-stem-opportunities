# REVIEW DRAFT: install only on a new operations branch, not main or the app PR.
# Reuses the existing default-registered workflow path for manual --ref dispatch.
name: Review isolated fresh-data reconciliation
on:
  push:
    branches: [codex/frontend-reconcile-20261109]
    paths: [.github/workflows/refresh-opportunities.yml]

permissions:
  contents: read
concurrency:
  group: gta-reviewed-data-reconciliation-single-writer
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'rupayon123/gta-free-stem-opportunities' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub permissions are job-level. The write credential is never passed to
    # app verification and is consumed only by the final fixed-endpoint helper.
    permissions:
      contents: write
    env:
      OPS_ROOT: ${{ github.workspace }}/ops
      APP_REPO: ${{ github.workspace }}/app-source
      EXPECTED_OPS_COMMIT: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - name: Check event and immutable operations pin
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = codex/frontend-reconcile-20261109
          test "${{ github.event.before }}" = 7dc02d2867c36dfc7163b77ac9f4973c8f774dbb
          test "$GITHUB_REPOSITORY" = rupayon123/gta-free-stem-opportunities
          test "$GITHUB_SHA" = "$EXPECTED_OPS_COMMIT"
          [[ "$EXPECTED_OPS_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out immutable operations helpers separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified official v6 ref
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false
          fetch-depth: 2

      - name: Validate the one authorized workflow and manifest revision
        shell: bash
        run: |
          python3 - <<'PYVALIDATE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['OPS_ROOT'])
          def git(*args):
              return subprocess.check_output(['git',*args],cwd=root)
          parent='7dc02d2867c36dfc7163b77ac9f4973c8f774dbb'
          assert git('rev-parse','HEAD').decode().strip()==os.environ['EXPECTED_OPS_COMMIT']
          assert git('rev-list','--parents','-n','1','HEAD').decode().split()==[os.environ['EXPECTED_OPS_COMMIT'],parent]
          manifest='hosting/reconcile/helpers-manifest.json'
          workflow='.github/workflows/refresh-opportunities.yml'
          publisher='hosting/reconcile/publish-candidate.py'
          verifier='hosting/reconcile/verify-reconciled-feed.py'
          runner='hosting/reconcile/run-reconciliation.py'
          assert set(git('diff','--name-only',parent,'HEAD').decode().splitlines())=={manifest,workflow,publisher,verifier,runner}
          previous=git('show',parent+':'+manifest)
          assert hashlib.sha256(previous).hexdigest()=='537480fda885f60933d9c25d22762e209cced235c1a78caf9c509754fd8381b3'
          original=json.loads(previous)
          raw=(root/manifest).read_bytes()
          current=json.loads(raw)
          before={item['path']:item for item in original['files']}
          after={item['path']:item for item in current['files']}
          assert len(before)==len(original['files'])==len(after)==len(current['files'])
          assert before.keys()==after.keys()
          assert {k:v for k,v in original.items() if k!='files'}=={k:v for k,v in current.items() if k!='files'}
          assert all(before[name]==after[name] for name in before if name not in {workflow,publisher,verifier,runner})
          assert after[publisher]=={'path':publisher,'sha256':'c52fbb36b0c295779323b10d990d5465b87e680fece89ade0967f3be344d0997','bytes':7160}
          assert hashlib.sha256((root/publisher).read_bytes()).hexdigest()=='c52fbb36b0c295779323b10d990d5465b87e680fece89ade0967f3be344d0997'
          assert after[verifier]=={'path':verifier,'sha256':'8d31e2a2eda6a623523455516a531c8fb472d9b1f815d816285f3a0320872acc','bytes':12761}
          assert hashlib.sha256((root/verifier).read_bytes()).hexdigest()=='8d31e2a2eda6a623523455516a531c8fb472d9b1f815d816285f3a0320872acc'
          assert after[runner]=={'path':runner,'sha256':'c0c944dcf9e80ed11a0f28972049ab79c60905f9886ef750940b63a2ca981ed7','bytes':8881}
          assert hashlib.sha256((root/runner).read_bytes()).hexdigest()=='c0c944dcf9e80ed11a0f28972049ab79c60905f9886ef750940b63a2ca981ed7'
          actual=(root/workflow).read_bytes()
          assert after[workflow]=={'path':workflow,'sha256':hashlib.sha256(actual).hexdigest(),'bytes':len(actual)}
          expected=hashlib.sha256(raw).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('EXPECTED_HELPERS_SHA256='+expected+'\n')
          print(json.dumps({'authorizedParent':parent,'actualOperationsCommit':os.environ['EXPECTED_OPS_COMMIT'],'verifiedHelpersSHA256':expected,'changedPaths':[workflow,manifest,publisher,verifier,runner]}))
          PYVALIDATE

      - name: Verify independently pinned helper sources
        run: python3 "$OPS_ROOT/hosting/reconcile/verify-helpers.py" --expected-sha256 "$EXPECTED_HELPERS_SHA256"

      - name: Check out immutable app without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9f83e87e4447b805373ff9f7f206adb737e5c413
          path: app-source
          persist-credentials: false
          fetch-depth: 0

      - name: Set up existing Node major with no persistent dependency cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # verified official v6 ref
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Guard isolated ordinary merge, offline proofs and existing QA
        run: |
          python3 "$OPS_ROOT/hosting/reconcile/guard-linux.py" \
            --new-guard-receipt "$RUNNER_TEMP/reconciliation-resource.json" \
            --timeout-seconds 1200 -- \
            python3 "$OPS_ROOT/hosting/reconcile/run-reconciliation.py"

      - name: Create only a new reviewed candidate ref after all proofs
        env:
          RECONCILE_WRITE_TOKEN: ${{ github.token }}
        run: |
          python3 "$OPS_ROOT/hosting/reconcile/guard-linux.py" \
            --new-guard-receipt "$RUNNER_TEMP/candidate-ref-resource.json" \
            --timeout-seconds 300 -- \
            python3 "$OPS_ROOT/hosting/reconcile/publish-candidate.py"
