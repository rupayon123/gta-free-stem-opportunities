name: Refresh public opportunities

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh source-backed static database
    runs-on: ubuntu-latest
    concurrency:
      group: gta-free-stem-opportunities-refresh
      cancel-in-progress: true
    env:
      GTA_MAX_LIBRARY_OPPORTUNITIES: "15000"
      GTA_LIBRARY_PAGES_PER_SOURCE: "300"
      GTA_LOOKAHEAD_DAYS: "365"
      GTA_DISCOVERY_MAX_CANDIDATES_PER_SOURCE: "250"
      GTA_MIN_LIBRARY_PAGE_SUCCESS_RATIO: "0.75"
      GTA_MIN_LIBRARY_SOURCE_SUCCESS_RATIO: "0.50"
      GTA_MIN_LIBRARY_OUTPUT_RATIO: "0.65"
      GTA_MIN_LIBRARY_OPPORTUNITIES: "30"
      GTA_MIN_DISCOVERY_SOURCE_SUCCESS_RATIO: "0.75"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify refresh publication safeguards
        run: python3 scripts/test-refresh-publication.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Refresh source-backed website database
        env:
          GTA_LIBRARY_RSS_CACHE_DIR: ${{ runner.temp }}/gta-library-rss
        run: npm run engine:refresh

      - name: Build static export
        run: npm run build

      - name: Commit refreshed database
        env:
          GTA_LIBRARY_RSS_CACHE_DIR: ${{ runner.temp }}/gta-library-rss
        run: bash scripts/publish-refreshed-opportunities.sh
