name: Historical French description pilot
on:
  push:
    branches: [codex/french-pilot-20261109-01]
    paths: [.github/workflows/translation-french-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-french-description-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'rupayon123/gta-free-stem-opportunities' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test source coverage and literal protection
        run: python3 -m unittest discover -s scripts/translations -p 'test_full_description_translation.py' -v
      - name: Test protected literals
        run: python3 -m unittest discover -s scripts/translations -p 'test_protected_spans.py' -v
      - name: Install CPU runtime
        run: |
          python3 -m pip install --no-cache-dir 'https://download.pytorch.org/whl/cpu/torch-2.14.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=5a6363570c753812540a05eb82380e329469cbe668643e88111414c12627711f'
          python3 -m pip install --no-cache-dir transformers==5.21.0 sentencepiece==0.2.2 sacremoses==0.1.1
      - name: Run historical source trial
        run: python3 scripts/translations/benchmark_french_pilot.py --fixture scripts/translations/fixtures/french-pilot-20261028.json --model-dir "$RUNNER_TEMP/french-pilot-model" --output french-pilot.json
      - name: Check evidence size
        id: evidence
        if: always()
        run: |
          if [ -f french-pilot.json ] && [ "$(wc -c < french-pilot.json)" -le 1000000 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain experimental evidence for review
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: historical-french-description-pilot
          path: french-pilot.json
          if-no-files-found: ignore
          retention-days: 1
