name: Backend-only dual-feed review
on:
  push:
    branches: [codex/backend-dual-release-20261110]
    paths: [.github/workflows/backend-release-review.yml]
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'rupayon123/gta-free-stem-opportunities' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run qa
      - run: npx tsx --test --test-concurrency=1 lib/accessibilitySupport.test.ts lib/accessibility/reviewedPolicies.test.ts
      - run: npx tsx lib/accessibility/reviewedHunterEvents.test.ts
      - run: npx tsx scripts/native-source-policy.test.mjs
      - run: npx tsx scripts/autism-ontario-discovery.test.ts
      - run: npx tsx scripts/discovery-refresh-guard.test.ts
      - run: npx tsx scripts/broad-discovery.test.ts
      - run: npx tsx scripts/discovery-pipeline.test.ts
      - run: python3 scripts/test-refresh-publication.py
      - run: GTA_REVIEW_V1_PATH=public/opportunities.json GTA_REVIEW_V2_PATH=public/opportunities-v2.json npx tsx scripts/dual-native-feed.test.ts
      - run: GTA_PUBLIC_OPPORTUNITIES_EXPORT=public/opportunities-v2.json npx tsx scripts/hunter-candidate-feed.test.ts
      - run: sha256sum public/opportunities.json public/opportunities-v2.json
      - run: npm run build
