name: Hunter expansion review checks
# Check scoped collectors, review-candidate eligibility, and source policies.
on:
  push:
    branches: [codex/hunter-feed-revision-20261110]
    paths: [.github/workflows/hunter-expansion-qa.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checks:
    if: github.repository == 'rupayon123/gta-free-stem-opportunities' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run qa:catalog
      - run: npx tsx scripts/native-content-rights.test.ts
      - run: npx tsx scripts/native-source-policy.test.mjs
      - run: npx tsx scripts/autism-ontario-discovery.test.ts
      - run: npm run qa:accessibility-support
      - run: npx tsx lib/accessibility/reviewedHunterEvents.test.ts
      - run: GTA_PUBLIC_OPPORTUNITIES_EXPORT="$RUNNER_TEMP/hunter-candidate.json" npx tsx scripts/export-public-opportunities.ts --publish
      - run: GTA_PUBLIC_OPPORTUNITIES_EXPORT="$RUNNER_TEMP/hunter-candidate.json" npx tsx scripts/hunter-candidate-feed.test.ts
      - name: Save tested bytes to a new review-only branch
        if: github.ref == 'refs/heads/codex/hunter-feed-revision-20261110' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          review_dir="$RUNNER_TEMP/hunter-review-worktree"
          review_branch="codex/hunter-feed-review-20261110-$GITHUB_RUN_ID"
          git worktree add --detach "$review_dir" HEAD
          git -C "$review_dir" switch --orphan "$review_branch"
          cp "$RUNNER_TEMP/hunter-candidate.json" "$review_dir/hunter-candidate.json"
          git -C "$review_dir" add hunter-candidate.json
          git -C "$review_dir" -c user.name='gta-review-bot' -c user.email='gta-review-bot@users.noreply.github.com' commit -m 'Save tested review-only feed bytes'
          git -C "$review_dir" push origin "HEAD:refs/heads/$review_branch"
          sha256sum "$review_dir/hunter-candidate.json"
          echo "Review branch: $review_branch"
